{% load static %}

<header>
    <nav>
        <a href="{% url 'index' %}" class="logo">
            <img src="{% static 'media/logo2.svg' %}" alt="Пассажирам.РФ" height="40">
        </a>
        <div class="nav-links">
            <a href="{% url 'index' %}">Главная</a>
            {% if user.is_authenticated %}
                | <a href="{% url 'create_request' %}">Запись на обучение</a>
                | <a href="{% url 'my_requests' %}">Мои заявки</a>
                {% if user.is_staff %}
                    | <a href="{% url 'admin_panel' %}">Админ панель</a>
                {% endif %}
                | <span>{{ user.username }}</span> |
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                | <a href="{% url 'login' %}">Войти</a> |
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </nav>
</header>

<style>
    header {
        background-color: #ffffff;
        padding: 10px 20px;
        border-bottom: 2px solid #007bff;
    }
    
    header nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 20px;
    }
    
    header .logo {
        flex-shrink: 0;
    }
    
    header .logo img {
        display: block;
        height: 40px;
        width: auto;
    }
    
    header .nav-links {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }
    
    header a {
        color: #007bff;
        text-decoration: none;
    }
    
    header a:hover {
        text-decoration: underline;
    }
    
    header span {
        color: #0d47a1;
        font-weight: 700;
    }
</style>
