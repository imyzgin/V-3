<header>
    <nav>
        <a href="{% url 'index' %}">Главная</a>
        {% if user.is_authenticated %}
            | <a href="{% url 'create_request' %}">Запись на обучение</a>
            | <a href="{% url 'my_requests' %}">Мои заявки</a>
            {% if user.is_staff %}
                | <a href="{% url 'admin_panel' %}">Админ панель</a>
            {% endif %}
            | <a href="{% url 'logout' %}">Выйти ({{ user.username }})</a>
        {% else %}
            | <a href="{% url 'login' %}">Войти</a> |
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
