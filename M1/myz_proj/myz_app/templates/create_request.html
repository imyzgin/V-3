{% extends 'base.html' %}

{% block title %}Запись на обучение{% endblock %}

{% block content %}
<h1>Запись на обучение</h1>

<form method="post">
    {% csrf_token %}
    
    {% for field in form %}
        <div>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                {{ field.errors }}
            {% endif %}
        </div>
    {% endfor %}
    
    <button type="submit">Отправить заявку</button>
</form>
{% endblock %}
